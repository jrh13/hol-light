name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # check PRs
  pull_request:
    branches:
      - master

  # check pushes
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # 'switch' is the Makefile target creating the local OPAM switch,
          # or 'legacy' for an old OCaml from the opam archive repo.
          # 'banner' is the Camlp5 banner hol.sh must print.
          # 'module' also tests the HOLLIGHT_USE_MODULE=1 build.
          - name: OCaml 4.06, Camlp5 7.10
            switch: legacy
            banner: Camlp5 parsing version
            module: false
          - name: OCaml 4.14, Camlp5 8.03 (make switch)
            switch: switch
            banner: Camlp5 parsing version (HOL-Light)
            module: true
          - name: OCaml 5.5, Camlp5 8.05 (make switch-5)
            switch: switch-5
            banner: Camlp5 parsing version (HOL-Light)
            module: true

    defaults:
      run:
        shell: bash
        working-directory: hol-light

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: hol-light

      - name: Install OPAM
        run: sudo apt update && sudo apt install -y opam xdot

      - name: Set up OCaml 4.06 (opam archive repo)
        if: matrix.switch == 'legacy'
        run: |
          # Old OCaml versions live in the opam archive repo, so add it as a
          # default repository before creating the switch.
          opam init -n --disable-sandboxing --bare
          opam repository add archive --set-default \
            git+https://github.com/ocaml/opam-repository-archive
          opam switch create 4.06 ocaml-base-compiler.4.06.0
          eval $(opam env --switch=4.06 --set-switch)
          opam pin -y add camlp5 7.10
          opam install -y num ledit camlp-streams ocamlfind

      - name: Set up OCaml (make ${{ matrix.switch }})
        if: matrix.switch != 'legacy'
        run: |
          opam init --disable-sandboxing
          make ${{ matrix.switch }}

      - name: Build
        run: opam exec -- make

      - name: Check hol.sh -version and -help
        run: opam exec -- .github/ci/check-hol-sh.sh

      - name: Load HOL Light
        run: opam exec -- .github/ci/check-load.sh "${{ matrix.banner }}"

      - name: Build (HOLLIGHT_USE_MODULE=1)
        if: matrix.module
        run: |
          opam exec -- make clean
          HOLLIGHT_USE_MODULE=1 opam exec -- make

      - name: Check hol.sh -version and -help (HOLLIGHT_USE_MODULE=1)
        if: matrix.module
        run: opam exec -- .github/ci/check-hol-sh.sh 1

      - name: Load HOL Light (HOLLIGHT_USE_MODULE=1)
        if: matrix.module
        run: opam exec -- .github/ci/check-load.sh "${{ matrix.banner }}"

      - name: Run unit tests
        if: matrix.module
        run: for t in UnitTests/*.byte UnitTests/*.native; do opam exec -- ./$t; done

      - name: Check that HOLLIGHT_USE_MODULE is remembered correctly
        if: matrix.module
        run: opam exec -- .github/ci/check-config.sh
